name: PyTorch Foundation Project Incubation Application
description: Submit a project contribution proposal for PyTorch Foundation Incubation.
title: '[Incubation] <Project Name>'
labels:
- New
assignees:
- michellearoth
body:
- type: markdown
  attributes:
    value: |-
      <img src="https://raw.githubusercontent.com/pytorch-fdn/artwork/main/assets/img/pytorch_foundation_logo/stacked/svg/PyTorchFLogo_Stacked_fullColor.svg" alt="PyTorch Foundation" width="180">

      Apply for Incubation under the PyTorch Foundation. Identify a current Technical Advisory Council (TAC) member to sponsor and guide your proposal before submitting.

      When you click **Submit new issue**, GitHub creates a public issue for your application. Bookmark that issue to track its progress, see reviewer questions, and reply in the same thread. Select **Subscribe** on the issue if you'd like notifications.

      The TAC reviews your proposal. Be prepared to present a 20–30 minute overview covering project scope, community health, and upcoming goals. This issue is public. Share only information you can disclose publicly.
- type: markdown
  attributes:
    value: '### Project overview'
- type: input
  id: project-name
  attributes:
    label: Project name
    description: Enter the official project name.
  validations:
    required: true
- type: input
  id: one-line-summary
  attributes:
    label: One-line summary
    description: Summarize what the project does in one sentence.
  validations:
    required: true
- type: textarea
  id: mission-scope-and-fit
  attributes:
    label: Mission, scope, and fit
    description: Describe the problem the project solves, who uses it, what is in scope, and why you are
      seeking PyTorch Foundation hosting. Describe any relevant relationship to PyTorch or the broader
      ML ecosystem.
  validations:
    required: true
- type: input
  id: tac-sponsor
  attributes:
    label: TAC sponsor
    description: Provide the name of the current TAC member sponsoring this application. Include their
      GitHub handle if available.
  validations:
    required: true
- type: markdown
  attributes:
    value: '### Repositories, documentation, and licensing'
- type: input
  id: github-organization-url
  attributes:
    label: GitHub organization URL
    description: Link to the standalone project organization. Confirm in the repository links field that
      it contains only project repositories, or explain any cleanup still needed.
  validations:
    required: true
- type: textarea
  id: repository-and-documentation-links
  attributes:
    label: Repository and documentation links
    description: Link to the main repository, user documentation, README, CODEOWNERS, CONTRIBUTING, and
      RELEASE files. Confirm the organization contains only project repositories. Identify any gaps and
      plans to address them.
  validations:
    required: true
- type: textarea
  id: code-license
  attributes:
    label: Code license
    description: Identify the permissive code license and link to the license file. The lifecycle lists
      Apache-2.0, MIT, and BSD-3-Clause.
  validations:
    required: true
- type: textarea
  id: documentation-and-specification-licenses
  attributes:
    label: Documentation and specification licenses
    description: Identify and link to the open licenses for your documentation and specifications. If
      you do not maintain specification documents, say so.
  validations:
    required: true
- type: markdown
  attributes:
    value: '### Governance, project health, and roadmap'
- type: textarea
  id: technical-governance
  attributes:
    label: Technical governance
    description: Link to governance documentation or describe how maintainers are appointed, how technical
      decisions are made, and how contributors can participate.
  validations:
    required: true
- type: textarea
  id: maintainers-and-contributors
  attributes:
    label: Maintainers and contributors
    description: List core maintainers, their GitHub handles and public affiliations, and provide links
      showing contributions from multiple organizations. Use public evidence only.
  validations:
    required: true
- type: textarea
  id: activity-testing-and-releases
  attributes:
    label: Activity, testing, and releases
    description: Link to recent activity and releases. Explain how code is built, tested, and released,
      and describe your release cadence.
  validations:
    required: true
- type: textarea
  id: security-and-license-remediation
  attributes:
    label: Security and license remediation
    description: Describe how you receive security reports and identify and remediate security and licensing
      issues. Link to public policies where available.
  validations:
    required: true
- type: textarea
  id: upcoming-goals
  attributes:
    label: Upcoming goals
    description: Summarize upcoming milestones and priorities. Link to a public roadmap if available.
  validations:
    required: true
- type: textarea
  id: adoption-and-compatibility
  attributes:
    label: Adoption and compatibility
    description: Share any public evidence of usage, integrations, or deployments. If relevant, list supported
      PyTorch versions.
  validations:
    required: false
- type: markdown
  attributes:
    value: |-
      ### Incubation commitments

      Following TAC approval, onboarding includes completing and approving the Technical Charter, transferring relevant trademarks and assisting with filings as applicable, enabling Linux Foundation owner access to project assets, enabling EasyCLA or DCO on project repositories, and establishing a project TSC that meets publicly at least quarterly.
- type: textarea
  id: additional-information
  attributes:
    label: Additional information
    description: Share any other context, questions, or onboarding dependencies for TAC review.
  validations:
    required: false
- type: checkboxes
  id: ongoing-review
  attributes:
    label: Quarterly updates and annual review
    options:
    - label: I understand that Incubated projects provide quarterly updates to the TAC and participate
        in an annual review.
      required: true
